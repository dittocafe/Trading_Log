baseURL = "https://dittocafe.com/"
languageCode = "zh-cn"
title = "DittoCafe"
defaultContentLanguage = "zh"
enableGitInfo = true

googleAnalytics = "G-CRXQLYSX6R"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # 允许在 Markdown 中渲染 HTML/链接

[params]
  env = "production"
  title = "DittoCafe"
  description = "DittoCafe 收录巴菲特与伯克希尔·哈撒韦历年股东信中文译本，以及交易与投资笔记。"
  author = "Xihi"
  images = ["/images/buffett-letters-og.png"]
  defaultTheme = "auto"

  # 💡 将这些 Show 开头的参数统一收录在 [params] 正下方，确保它们正确生效
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = false
  ShowTagsSection = false

  [params.assets]
    favicon = "/images/ditto-logo.png"
    favicon16x16 = "/images/ditto-logo.png"
    favicon32x32 = "/images/ditto-logo.png"
    apple_touch_icon = "/images/ditto-logo.png"

  [params.schema]
    publisherType = "Organization"

[frontmatter]
  lastmod = [":git", "lastmod"]

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    name = "Trading"
    url = "https://trading.dittocafe.com"
    weight = 1

  [[menu.main]]
    name = "Memos"
    url = "https://memos.dittocafe.com"
    weight = 2

  [[menu.main]]
    name = "Buffett Letters"
    url = "/buffettletter/"
    weight = 3

[outputs]
  home = ["HTML", "RSS", "JSON"]
